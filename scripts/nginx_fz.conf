# 飞证 mTLS 反向代理（P0-4 mTLS 试点 + P0-6 限流——同一配置面）。
# 拓扑：浏览器/API 客户端 → nginx(TLS) → 本机明文环回服务（8000 backend / 8100 bridge）。
#   443  : backend 浏览器档（服务端 TLS——浏览器无客户端证书）
#   8443 : bridge TLS（https 页面 fetch 明文 bridge 会被混合内容拦截）
#   9443 : backend mTLS 档（ssl_verify_client on——服务互认；无证书客户端 400）
# 限流（P0-6）：apply 严 / 常规 API 宽；返回 429。
# 启动：wsl -u root nginx -c /mnt/c/.../scripts/nginx_fz.conf
# 证书：backend/scripts/gen_certs.py 生成（backend/certs/，私钥零入库）。

pid /tmp/nginx_fz.pid;
error_log /tmp/nginx_fz_error.log warn;
worker_processes 1;
events { worker_connections 256; }

http {
    access_log /tmp/nginx_fz_access.log;
    client_max_body_size 64m;          # 出证产物/证明文件上传余量

    # P0-6 限流分区（按客户端 IP）
    limit_req_zone $binary_remote_addr zone=fz_apply:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=fz_api:10m rate=50r/s;
    limit_req_status 429;

    # --- 证书面（gen_certs.py 产物） ---
    ssl_certificate     ${UAS_WSL}/backend/certs/server.crt;
    ssl_certificate_key ${UAS_WSL}/backend/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- 443：backend 浏览器档（服务端 TLS；常规 API 限流） ---
    server {
        listen 443 ssl;
        location / {
            limit_req zone=fz_api burst=100 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /authz/apply {        # 受理面=匿名 DoS 门户（业务级防护外再加网络级）
            limit_req zone=fz_apply burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # --- 8443：bridge TLS（页面 https 后 fetch 目标） ---
    server {
        listen 8443 ssl;
        location / {
            limit_req zone=fz_api burst=100 nodelay;
            proxy_pass http://127.0.0.1:8100;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # --- 9443：backend mTLS 档（服务互认——无证书 400） ---
    server {
        listen 9443 ssl;
        ssl_verify_client on;
        ssl_client_certificate ${UAS_WSL}/backend/certs/ca.crt;
        location / {
            limit_req zone=fz_api burst=100 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-CN $ssl_client_s_dn;
        }
        location /authz/apply {
            limit_req zone=fz_apply burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Client-CN $ssl_client_s_dn;
        }
    }
}
