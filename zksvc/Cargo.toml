[package]
name = "zksvc"
version = "0.1.0"
edition = "2021"
description = "飞证证明服务——AUTH 资格证明语句（B3 fork 旧 zksvc 架构：装配/证明/判决件/CLI；vendor 钉定 system/uas-auth@8785400）"

[dependencies]
# 论文资产单向引用（飞证 B3）：vendor 快照 = git -c core.autocrlf=false archive of
# 共享仓 system/uas-auth@8785400（权威=zksvc/MANIFEST.json 逐文件 SM3+aggregate；
# 上游=本团队论文栈 paper-anchor-v3 系+SM3 查表化+AUTH 语句）。
# features=benchmark 与 probe_sm2_verify 一致（解出 parallel/rayon）。
plonkish_backend = { path = "vendor/plonkish-4201a82/plonkish/plonkish_backend", features = ["benchmark"] }
plonkish_sm2_probe = { path = "vendor/plonkish-4201a82/plonkish/plonkish_sm2_probe" }
# 与论文栈同版本同源（ctx_tag 映射的 FpSM2::MODULUS 权威+SM3 全哈希）
ff = "0.13.0"
sm3 = "0.4.2"
rand = "0.8.5"
bincode = "1.3.3"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[[bin]]
name = "zkc"
path = "src/main.rs"

[features]
# 探针档：转发 vendor timer（ark-std print-trace——witness/lookup/置换/开口分段计时
# 到 stderr）。默认关；仅测量构建启用（--features probe-timer），零行为差异。
probe-timer = ["plonkish_backend/timer"]

[profile.release]
# 与论文栈 release 语义一致（不另调优，保护字节级复现锚）
